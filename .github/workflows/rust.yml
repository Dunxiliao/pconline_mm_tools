# 仅 macOS 安装包；Windows 仍在本地执行 build-prod.ps1

# matrix：aarch64（M 芯片）+ x86_64（Intel）各打一个 dmg

name: Build macOS (Tauri)



on:

  workflow_dispatch:

    inputs:

      apple_sign:

        description: Sign and notarize with Apple certificate (requires APPLE_* secrets)

        type: boolean

        default: false

  push:

    tags:

      - "v*"



env:

  CARGO_INCREMENTAL: 0



jobs:

  build-macos:

    name: Build macOS ${{ matrix.target }}

    runs-on: macos-latest

    timeout-minutes: 90

    strategy:

      fail-fast: false

      matrix:

        include:

          - target: aarch64-apple-darwin

          - target: x86_64-apple-darwin

    defaults:

      run:

        working-directory: Pconline.Invoice.Tauri



    steps:

      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

          cache: npm

          cache-dependency-path: Pconline.Invoice.Tauri/package-lock.json



      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable

        with:

          targets: ${{ matrix.target }}



      - name: Install x86 OpenSSL

        if: matrix.target == 'x86_64-apple-darwin'

        run: |

          arch -x86_64 brew install openssl@3

          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"

          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"



      - name: Cache Rust dependencies

        uses: swatinem/rust-cache@v2

        with:

          workspaces: Pconline.Invoice.Tauri/src-tauri

          shared-key: macos-${{ matrix.target }}



      - name: Install frontend dependencies

        run: npm ci



      - name: Verify prod env file

        run: test -f env/.env.prod



      - name: Import Apple Developer certificate

        if: github.event_name == 'workflow_dispatch' && inputs.apple_sign == true

        env:

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

        run: |

          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security default-keychain -s build.keychain

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security set-keychain-settings -t 3600 -u build.keychain

          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then

            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"

          else

            CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"$/\1/')

            if [ -z "$CERT_ID" ]; then

              echo "No Developer ID Application certificate found in keychain." >&2

              security find-identity -v -p codesigning build.keychain || true

              exit 1

            fi

            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

          fi

          echo "Using signing identity: $APPLE_SIGNING_IDENTITY"



      - name: Build Tauri (macOS, no Apple sign)

        if: github.event_name != 'workflow_dispatch' || inputs.apple_sign != true

        env:

          APP_ENV: prod

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        run: npm run tauri build -- --target ${{ matrix.target }} --verbose



      - name: Build Tauri (macOS, Apple sign + notarize)

        if: github.event_name == 'workflow_dispatch' && inputs.apple_sign == true

        env:

          APP_ENV: prod

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_ID: ${{ secrets.APPLE_ID }}

          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

        run: npm run tauri build -- --target ${{ matrix.target }} --verbose



      - name: Upload macOS bundle

        uses: actions/upload-artifact@v4

        with:

          name: pconline-tools-macos-${{ matrix.target }}-${{ github.sha }}

          if-no-files-found: error

          path: |

            Pconline.Invoice.Tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/**

            Pconline.Invoice.Tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/**

            Pconline.Invoice.Tauri/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig


