# macOS 安装包（aarch64 + x86_64）；Windows 仍在本地执行 build-prod.ps1
# 使用 tauri-action 构建、签名、公证并上传 GitHub Release

name: Release macOS (Tauri)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release tag (e.g. v2.3.6)
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-macos:
    name: Build macOS ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    defaults:
      run:
        working-directory: Pconline.Invoice.Tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: rust-shared-stable-macos-${{ matrix.target }}
          workspaces: Pconline.Invoice.Tauri/src-tauri -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install x86 OpenSSL
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          arch -x86_64 brew install openssl@3
          OPENSSL_PREFIX="$(arch -x86_64 brew --prefix openssl@3)"
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PREFIX/include" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Pconline.Invoice.Tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify prod env file
        run: test -f env/.env.prod

      # tauri build --target 会把 --target 透传给 beforeBuildCommand，vite/esbuild 无法识别 Rust triple
      - name: Build frontend
        run: npm run build

      - name: Build and upload macOS bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          APP_ENV: prod
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: Pconline.Invoice.Tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_version }}
          releaseName: Pconline Tools ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_version }}
          releaseBody: macOS release build.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.release_version, '-rc') }}
          tauriScript: npm
          args: --target ${{ matrix.target }} --config '{"build":{"beforeBuildCommand":""}}'
          includeUpdaterJson: true
